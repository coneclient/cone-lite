plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-lite"
}

repositories {
	// Loom adds Minecraft + library repos automatically. Add mod repos here if needed.
	mavenCentral() // Skija (new GUI renderer) — compile-only; natives are runtime-downloaded.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"cone" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// MC 26.1+ ships unobfuscated with param names — no mappings line needed.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Skija = the GUI's vector renderer. compileOnly so the classes/natives are NOT bundled —
	// the mod downloads skija-shared + types + the per-OS native at runtime (see SkijaLib) and
	// addToClassPath's them. Keeps the jar tiny and free of native binaries.
	clientCompileOnly "io.github.humbleui:skija-shared:0.143.17"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}
